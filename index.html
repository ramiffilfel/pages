<script>
/* ===================== Utilities ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const r2=n=>Math.round((+n||0)*100)/100;
const r3=n=>Math.round((+n||0)*1000)/1000;
const now=()=>new Date().toISOString();
function dkey(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>dkey(new Date());
const monthStart=()=>today().slice(0,8)+'01';
function fdate(d){const x=new Date(d);return dkey(x)+' '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')}
function money(n){return r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+esc(DB.data.settings.currency)}
function qtyFmt(q,u){return u==='kg'?(+q).toFixed(3).replace(/\.?0+$/,'')+' كغ':String(r3(q))}
const sum=(a,f)=>r2(a.reduce((s,x)=>s+(+f(x)||0),0));
function inRange(date,from,to){const k=dkey(date);return(!from||k>=from)&&(!to||k<=to)}
const METHODS={cash:'نقدي',card:'بطاقة بنكية',transfer:'تحويل بنكي'};
const PAY={...METHODS,debt:'آجل (دين)'};
const KINDS={sale:'مبيعات',return:'مرتجع',debt:'تحصيل دين',purchase:'مشتريات',supplier:'سداد مورد',expense:'مصروف','expense-cancel':'إلغاء مصروف',capital:'رأس مال',manual:'حركة يدوية',transfer:'تحويل'};
const EXP_CATS=['رواتب','إيجار','كهرباء وماء','نقل وتوصيل','صيانة','تسويق','ضرائب ورسوم','أخرى'];

/* ===================== Database Layer ===================== */
const DB={
  key:'supermarket_db_v1',data:null,silent:false,
  defaults(){return{
    meta:{version:1,created:now(),salt:uid(),seq:{invoice:1000,purchase:500}},
    settings:{storeName:'سوبر ماركت',currency:'ر.س',lowStock:5,theme:'light',passHash:null,defaultPass:true,apiUrl:'',apiToken:'',address:'',phone:'',receiptFooter:'شكراً لتسوقكم معنا'},
    products:[],customers:[],suppliers:[],invoices:[],purchases:[],expenses:[],movements:[],debtPayments:[],supplierPayments:[],capital:[],adjustments:[]
  }},
  load(){
    let d=null;try{d=JSON.parse(localStorage.getItem(this.key))}catch(e){}
    const def=this.defaults();
    if(!d||!d.meta){this.data=def;this.saveLocal();seed();return}
    for(const k in def)if(!(k in d))d[k]=def[k];
    d.settings={...def.settings,...d.settings};
    d.meta.seq={...def.meta.seq,...(d.meta.seq||{})};
    this.data=d;
  },
  saveLocal(){try{localStorage.setItem(this.key,JSON.stringify(this.data))}catch(e){toast('تعذر الحفظ المحلي: '+e.message,'error')}},
  save(){this.saveLocal();if(!this.silent)Server.push()},
  /* Atomic transaction: all-or-nothing with rollback */
  tx(fn){const backup=JSON.stringify(this.data);try{const r=fn(this.data);this.save();return r}catch(e){this.data=JSON.parse(backup);throw e}}
};

/* Server adapter (REST): GET/PUT {apiUrl}/db with Bearer token */
const Server={
  status:'local',timer:null,
  base(){return(DB.data.settings.apiUrl||'').trim().replace(/\/$/,'')},
  headers(){return{'Content-Type':'application/json','Authorization':'Bearer '+(DB.data.settings.apiToken||'')}},
  async pull(){
    if(!this.base()){this.status='local';updateSync();return}
    try{
      const r=await fetch(this.base()+'/db',{headers:this.headers()});
      if(!r.ok)throw new Error(r.status);
      const d=await r.json();
      if(d&&d.meta&&Array.isArray(d.products)){
        const keep={apiUrl:DB.data.settings.apiUrl,apiToken:DB.data.settings.apiToken};
        d.settings={...DB.defaults().settings,...d.settings,...keep};
        DB.data=d;DB.saveLocal();
      }
      this.status='online';
    }catch(e){this.status='offline'}
    updateSync();
  },
  push(){
    if(!this.base())return;
    clearTimeout(this.timer);
    this.timer=setTimeout(async()=>{
      try{const r=await fetch(this.base()+'/db',{method:'PUT',headers:this.headers(),body:JSON.stringify(DB.data)});if(!r.ok)throw 0;this.status='online'}
      catch(e){this.status='offline'}
      updateSync();
    },700);
  }
};
function updateSync(){
  const b=$('#syncBadge');if(!b)return;
  const m={local:['قاعدة بيانات محلية','bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'],online:['متصل بالخادم','bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300'],offline:['الخادم غير متاح - حفظ محلي','bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300']}[Server.status];
  b.textContent='● '+m[0];b.className='badge hidden sm:inline-block '+m[1];
}

/* ===================== Business Logic ===================== */
const getP=id=>DB.data.products.find(x=>x.id===id);
const getC=id=>DB.data.customers.find(x=>x.id===id);
const getS=id=>DB.data.suppliers.find(x=>x.id===id);
function balance(m,d=DB.data){return r2(d.movements.filter(x=>!m||x.method===m).reduce((s,x)=>s+(x.type==='in'?x.amount:-x.amount),0))}
function addMove(d,method,type,amount,kind,note,ref,date){amount=r2(amount);if(amount<=0)return;d.movements.push({id:uid(),date:date||now(),method,type,amount,kind,note:note||'',ref:ref||''})}
function needBal(d,method,amount){if(balance(method,d)<r2(amount)-0.001)throw new Error(`رصيد ${METHODS[method]} غير كافٍ (المتاح ${money(balance(method,d))})`)}
function posNum(v,msg){v=+v;if(!(v>0))throw new Error(msg||'أدخل مبلغًا صحيحًا أكبر من صفر');return r2(v)}
function returnedQty(inv,idx){return r3(inv.returns.reduce((s,r)=>s+r.items.filter(i=>i.idx===idx).reduce((a,i)=>a+i.qty,0),0))}

const Ops={
  saveProduct(p){return DB.tx(d=>{
    const name=String(p.name||'').trim();if(!name)throw new Error('اسم المنتج مطلوب');
    const price=+p.price,cost=+p.cost;if(!(price>=0)||!(cost>=0)||p.price===''||p.cost==='')throw new Error('أدخل أسعار شراء وبيع صحيحة');
    const unit=p.unit==='kg'?'kg':'piece';
    const barcode=String(p.barcode||'').trim();
    if(barcode&&d.products.some(x=>x.barcode===barcode&&x.id!==p.id))throw new Error('الباركود مستخدم لمنتج آخر');
    const data={name,barcode,category:String(p.category||'').trim()||'عام',unit,price:r2(price),cost:r2(cost),minStock:Math.max(0,+p.minStock||0)};
    if(p.id){const ex=d.products.find(x=>x.id===p.id);if(!ex)throw new Error('المنتج غير موجود');Object.assign(ex,data,{updated:now()});return ex}
    const stock=r3(+p.stock||0);if(stock<0)throw new Error('الكمية لا يمكن أن تكون سالبة');
    const np={id:uid(),...data,stock,created:now()};d.products.push(np);
    if(stock>0&&cost>0)d.capital.push({id:uid(),date:now(),type:'goods',amount:r2(stock*cost),method:'',note:'بضاعة افتتاحية: '+name});
    return np;
  })},
  deleteProduct(id){return DB.tx(d=>{d.products=d.products.filter(x=>x.id!==id)})},
  adjustStock(id,delta,reason){return DB.tx(d=>{
    const p=d.products.find(x=>x.id===id);delta=r3(+delta);if(!delta)throw new Error('أدخل كمية التعديل');
    if(p.stock+delta<-1e-9)throw new Error('لا يمكن أن يصبح المخزون سالبًا');
    p.stock=r3(p.stock+delta);d.adjustments.push({id:uid(),date:now(),pid:id,name:p.name,delta,reason:reason||''});
  })},
  sell({items,discount=0,customerId='',method='cash',paid=0,date}){return DB.tx(d=>{
    if(!items||!items.length)throw new Error('السلة فارغة');
    const lines=items.map(it=>{const p=d.products.find(x=>x.id===it.pid);if(!p)throw new Error('منتج غير موجود في قاعدة البيانات');
      const qty=r3(it.qty);if(!(qty>0))throw new Error('كمية غير صحيحة: '+p.name);
      if(p.unit==='piece'&&!Number.isInteger(qty))throw new Error('المنتج يُباع بالقطعة: '+p.name);
      return{p,qty,price:it.price!=null?r2(it.price):p.price}});
    const needQ={};lines.forEach(l=>needQ[l.p.id]=r3((needQ[l.p.id]||0)+l.qty));
    lines.forEach(l=>{if(l.p.stock<needQ[l.p.id]-1e-9)throw new Error(`المخزون غير كافٍ لـ "${l.p.name}" (المتوفر ${qtyFmt(l.p.stock,l.p.unit)})`)});
    const subtotal=r2(lines.reduce((s,l)=>s+l.qty*l.price,0));
    discount=r2(+discount||0);if(discount<0||discount>subtotal)throw new Error('قيمة الخصم غير صحيحة');
    const total=r2(subtotal-discount);
    if(!PAY[method])throw new Error('طريقة دفع غير معروفة');
    let paidAmt=method==='debt'?r2(+paid||0):total;if(paidAmt<0)throw new Error('المبلغ المدفوع غير صحيح');if(paidAmt>total)paidAmt=total;
    const due=r2(total-paidAmt);
    const cust=customerId?d.customers.find(x=>x.id===customerId):null;
    if(due>0&&!cust)throw new Error('اختر العميل لتسجيل البيع الآجل');
    lines.forEach(l=>l.p.stock=r3(l.p.stock-l.qty));
    const no=++d.meta.seq.invoice;
    const inv={id:uid(),no,date:date||now(),customerId:cust?cust.id:'',customerName:cust?cust.name:'زبون نقدي',
      items:lines.map(l=>({pid:l.p.id,name:l.p.name,unit:l.p.unit,qty:l.qty,price:l.price,cost:l.p.cost})),
      subtotal,discount,total,paid:paidAmt,due,method,returns:[]};
    d.invoices.push(inv);
    if(due>0)cust.balance=r2((cust.balance||0)+due);
    addMove(d,method==='debt'?'cash':method,'in',paidAmt,'sale','فاتورة #'+no,inv.id,inv.date);
    return inv;
  })},
  returnItems(invId,ret){return DB.tx(d=>{
    const inv=d.invoices.find(x=>x.id===invId);if(!inv)throw new Error('الفاتورة غير موجودة');
    const ratio=inv.subtotal?inv.total/inv.subtotal:1;let amount=0,cost=0;const items=[];
    for(const [k,v] of Object.entries(ret)){const idx=+k,q=r3(v);if(!q)continue;if(q<0)throw new Error('كمية غير صحيحة');
      const it=inv.items[idx];if(!it)continue;const rem=r3(it.qty-returnedQty(inv,idx));
      if(q>rem+1e-9)throw new Error(`الكمية المرتجعة أكبر من المتبقي لـ "${it.name}"`);
      amount+=q*it.price*ratio;cost+=q*it.cost;items.push({idx,qty:q,name:it.name});
      const p=d.products.find(x=>x.id===it.pid);if(p)p.stock=r3(p.stock+q);}
    if(!items.length)throw new Error('لم تحدد أي كمية للإرجاع');
    amount=r2(amount);cost=r2(cost);
    const fromDebt=r2(Math.min(inv.due,amount));
    if(fromDebt>0){inv.due=r2(inv.due-fromDebt);const c=d.customers.find(x=>x.id===inv.customerId);if(c)c.balance=r2(Math.max(0,c.balance-fromDebt))}
    const cashBack=r2(amount-fromDebt);const m=inv.method==='debt'?'cash':inv.method;
    if(cashBack>0){needBal(d,m,cashBack);addMove(d,m,'out',cashBack,'return','مرتجع فاتورة #'+inv.no,inv.id)}
    inv.returns.push({id:uid(),date:now(),items,amount,cost,fromDebt,cashBack});
    return{amount,fromDebt,cashBack};
  })},
  saveCustomer(c){return DB.tx(d=>{
    const name=String(c.name||'').trim();if(!name)throw new Error('اسم العميل مطلوب');
    if(c.id){const ex=d.customers.find(x=>x.id===c.id);Object.assign(ex,{name,phone:c.phone||'',address:c.address||''});return ex}
    const n={id:uid(),name,phone:c.phone||'',address:c.address||'',balance:r2(Math.max(0,+c.opening||0)),created:now()};d.customers.push(n);return n;
  })},
  deleteCustomer(id){return DB.tx(d=>{const c=d.customers.find(x=>x.id===id);if(c.balance>0)throw new Error('لا يمكن حذف عميل عليه دين');d.customers=d.customers.filter(x=>x.id!==id)})},
  collectDebt(cid,amount,method='cash',note=''){return DB.tx(d=>{
    const c=d.customers.find(x=>x.id===cid);if(!c)throw new Error('العميل غير موجود');amount=posNum(amount);
    if(amount>c.balance+0.001)throw new Error('المبلغ أكبر من دين العميل ('+money(c.balance)+')');
    c.balance=r2(c.balance-amount);let rem=amount;
    d.invoices.filter(i=>i.customerId===cid&&i.due>0).sort((a,b)=>a.date.localeCompare(b.date)).forEach(i=>{if(rem<=0)return;const x=Math.min(i.due,rem);i.due=r2(i.due-x);rem=r2(rem-x)});
    const pay={id:uid(),date:now(),customerId:cid,customerName:c.name,amount,method,note};d.debtPayments.push(pay);
    addMove(d,method,'in',amount,'debt','تحصيل دين: '+c.name,pay.id);return pay;
  })},
  saveSupplier(s){return DB.tx(d=>{
    const name=String(s.name||'').trim();if(!name)throw new Error('اسم المورد مطلوب');
    if(s.id){const ex=d.suppliers.find(x=>x.id===s.id);Object.assign(ex,{name,phone:s.phone||'',company:s.company||''});return ex}
    const n={id:uid(),name,phone:s.phone||'',company:s.company||'',balance:0,created:now()};d.suppliers.push(n);return n;
  })},
  deleteSupplier(id){return DB.tx(d=>{const s=d.suppliers.find(x=>x.id===id);if(s.balance>0)throw new Error('لا يمكن حذف مورد له مستحقات');d.suppliers=d.suppliers.filter(x=>x.id!==id)})},
  purchase({supplierId,items,paid=0,method='cash',note=''}){return DB.tx(d=>{
    const s=d.suppliers.find(x=>x.id===supplierId);if(!s)throw new Error('اختر المورد');
    const lines=(items||[]).filter(i=>i.pid);if(!lines.length)throw new Error('أضف منتجًا واحدًا على الأقل');
    let total=0;const out=lines.map(l=>{const p=d.products.find(x=>x.id===l.pid);if(!p)throw new Error('منتج غير موجود');
      const qty=r3(l.qty),cost=r2(l.cost);if(!(qty>0))throw new Error('كمية غير صحيحة: '+p.name);if(!(cost>=0))throw new Error('تكلفة غير صحيحة');
      total+=qty*cost;return{p,qty,cost}});
    total=r2(total);paid=r2(+paid||0);if(paid<0||paid>total)throw new Error('المبلغ المدفوع غير صحيح');
    if(paid>0)needBal(d,method,paid);
    out.forEach(({p,qty,cost})=>{const st=Math.max(p.stock,0);p.cost=r2((st*p.cost+qty*cost)/(st+qty));p.stock=r3(p.stock+qty)});
    s.balance=r2(s.balance+total-paid);
    const no=++d.meta.seq.purchase;
    const pu={id:uid(),no,date:now(),supplierId:s.id,supplierName:s.name,items:out.map(o=>({pid:o.p.id,name:o.p.name,unit:o.p.unit,qty:o.qty,cost:o.cost})),total,paid,method,note};
    d.purchases.push(pu);addMove(d,method,'out',paid,'purchase','مشتريات #'+no+' - '+s.name,pu.id);return pu;
  })},
  paySupplier(sid,amount,method='cash'){return DB.tx(d=>{
    const s=d.suppliers.find(x=>x.id===sid);amount=posNum(amount);if(amount>s.balance+0.001)throw new Error('المبلغ أكبر من المستحق للمورد');
    needBal(d,method,amount);s.balance=r2(s.balance-amount);
    const p={id:uid(),date:now(),supplierId:sid,supplierName:s.name,amount,method};d.supplierPayments.push(p);
    addMove(d,method,'out',amount,'supplier','سداد مورد: '+s.name,p.id);
  })},
  addExpense({category,amount,method='cash',note='',date}){return DB.tx(d=>{
    amount=posNum(amount);needBal(d,method,amount);
    const e={id:uid(),date:date||now(),category:category||'أخرى',amount,method,note};d.expenses.push(e);
    addMove(d,method,'out',amount,'expense','مصروف: '+e.category,e.id,e.date);return e;
  })},
  deleteExpense(id){return DB.tx(d=>{const e=d.expenses.find(x=>x.id===id);d.expenses=d.expenses.filter(x=>x.id!==id);addMove(d,e.method,'in',e.amount,'expense-cancel','إلغاء مصروف: '+e.category,e.id)})},
  capital({type,amount,method='cash',note='',date}){return DB.tx(d=>{
    amount=posNum(amount);if(type==='withdraw')needBal(d,method,amount);
    const c={id:uid(),date:date||now(),type,amount,method,note};d.capital.push(c);
    addMove(d,method,type==='deposit'?'in':'out',amount,'capital',(type==='deposit'?'إيداع رأس مال':'سحب من رأس المال')+(note?': '+note:''),c.id,c.date);return c;
  })},
  cashOp({op,method,to,amount,note}){return DB.tx(d=>{
    amount=posNum(amount);
    if(op==='in')addMove(d,method,'in',amount,'manual',note||'إيداع يدوي');
    else if(op==='out'){needBal(d,method,amount);addMove(d,method,'out',amount,'manual',note||'سحب يدوي')}
    else{if(method===to)throw new Error('اختر طريقتين مختلفتين');needBal(d,method,amount);
      addMove(d,method,'out',amount,'transfer','تحويل إلى '+METHODS[to]);addMove(d,to,'in',amount,'transfer','تحويل من '+METHODS[method])}
  })},
  saveSettings(o){return DB.tx(d=>{Object.assign(d.settings,o)})}
};

/* ===================== Statistics ===================== */
function stats(from,to,d=DB.data){
  let sales=0,cost=0,count=0,returns=0,retCost=0,discounts=0;const byMethod={cash:0,card:0,transfer:0,debt:0};
  d.invoices.forEach(inv=>{
    if(inRange(inv.date,from,to)){sales+=inv.total;discounts+=inv.discount;cost+=inv.items.reduce((s,i)=>s+i.qty*i.cost,0);count++;
      byMethod[inv.method==='debt'?'cash':inv.method]+=inv.paid;byMethod.debt+=inv.total-inv.paid}
    inv.returns.forEach(r=>{if(inRange(r.date,from,to)){returns+=r.amount;retCost+=r.cost}});
  });
  const expenses=d.expenses.filter(e=>inRange(e.date,from,to)).reduce((s,e)=>s+e.amount,0);
  const purchases=d.purchases.filter(p=>inRange(p.date,from,to)).reduce((s,p)=>s+p.total,0);
  const collected=d.debtPayments.filter(p=>inRange(p.date,from,to)).reduce((s,p)=>s+p.amount,0);
  const netSales=sales-returns,cogs=cost-retCost,gross=netSales-cogs,net=gross-expenses;
  Object.keys(byMethod).forEach(k=>byMethod[k]=r2(byMethod[k]));
  return{sales:r2(sales),cost:r2(cost),count,returns:r2(returns),discounts:r2(discounts),expenses:r2(expenses),purchases:r2(purchases),collected:r2(collected),netSales:r2(netSales),cogs:r2(cogs),gross:r2(gross),net:r2(net),byMethod};
}

/* ===================== Security ===================== */
async function hashPw(pw){
  const data=new TextEncoder().encode('SM#'+DB.data.meta.salt+'#'+pw);
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=2166136261;for(const c of data){h^=c;h=Math.imul(h,16777619)}return'f'+(h>>>0).toString(16);
}

async function doLogin(e){
  e.preventDefault();const err=$('#loginErr');
  if(Date.now()<lockUntil){err.textContent='محاولات كثيرة، انتظر '+Math.ceil((lockUntil-Date.now())/1000)+' ثانية';return}
  const h=await hashPw($('#loginPw').value);
  if(h===DB.data.settings.passHash){fails=0;ss('sm_auth',DB.data.meta.salt);$('#loginPw').value='';err.textContent='';enterApp()}
  else{fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}err.textContent='كلمة المرور غير صحيحة';}
}

function scanBarcode(v){
  v=v.trim();if(!v)return;const p=DB.data.products.find(x=>x.barcode===v);
  const list=DB.data.products.filter(x=>x.name.includes(v));

  if(hit){addToCart(hit.id);posFilter='';$('#barcode').value='';renderPosGrid()}else toast('لم يتم العثور على المنتج','error');
}
function addToCart(pid,qty){
  const p=getP(pid);if(!p)return;
  if(p.unit==='kg'&&qty==null)return weightModal(pid);
  qty=qty??1;const line=cart.find(c=>c.pid===pid);const cur=line?line.qty:0;
  if(cur+qty>p.stock+1e-9)return toast('المخزون غير كافٍ: '+p.name,'error');
  if(line)line.qty=r3(line.qty+qty);else cart.push({pid,name:p.name,unit:p.unit,price:p.price,qty});
  renderCart();
}
function weightModal(pid){
  const p=getP(pid);
  openModal('بيع بالوزن: '+esc(p.name),`

  <div class="grid grid-cols-2 gap-3">${fld('الوزن (كغ)',`<input name="w" id="wW" type="number" step="0.001" min="0.001" class="input text-lg font-bold" required oninput="$('#wA').value=(this.value*${p.price}).toFixed(2)">`)}

  <div class="flex gap-2 flex-wrap">${[0.25,0.5,0.75,1,1.5,2,3].map(x=>`<button type="button" class="btn btn-ghost btn-sm" onclick="$('#wW').value=${x};$('#wW').dispatchEvent(new Event('input'))">${x} كغ</button>`).join('')}</div>`,

}

function checkout(){

let invF={q:'',from:'',to:'',st:''};
function invStatus(i){
  const tq=i.items.reduce((s,x)=>s+x.qty,0),rq=i.returns.reduce((s,r)=>s+r.items.reduce((a,x)=>a+x.qty,0),0);
  if(rq>0&&rq>=tq-1e-9)return['مرتجع كلي','bg-slate-200 text-slate-700 dark:bg-slate-600 dark:text-slate-100','returned'];
  if(rq>0)return['مرتجع جزئي','bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300','returned'];
  if(i.due>0)return['آجل','bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300','due'];
  return['مدفوعة','bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300','paid'];
}

/* ===================== CAPITAL ===================== */
function capSummary(){
  const dep=sum(DB.data.capital.filter(c=>c.type!=='withdraw'),c=>c.amount),wd=sum(DB.data.capital.filter(c=>c.type==='withdraw'),c=>c.amount);
  const capital=r2(dep-wd),inv=invValue(),cash=balance(),rec=totalDebts(),pay=totalPayables();
  const equity=r2(inv+cash+rec-pay);return{dep,wd,capital,inv,cash,rec,pay,equity,profit:r2(equity-capital)};
}

let cashF={m:'',k:''};
Pages.cashbox=()=>pageHead('cashbox',`<button class="btn btn-primary" onclick="cashModal('in')"><i data-lucide="arrow-down-to-line" class="w-4 h-4"></i> إيداع</button><button class="btn btn-danger" onclick="cashModal('out')"><i data-lucide="arrow-up-from-line" class="w-4 h-4"></i> سحب</button><button class="btn btn-blue" onclick="cashModal('transfer')"><i data-lucide="arrow-left-right" class="w-4 h-4"></i> تحويل</button>`)+`
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${stat('النقدية في الصندوق',money(balance('cash')),'banknote','emerald')}${stat('رصيد البطاقات',money(balance('card')),'credit-card','blue')}${stat('التحويلات البنكية',money(balance('transfer')),'landmark','violet')}${stat('إجمالي الأرصدة',money(balance()),'piggy-bank','teal')}</div>
  <div class="card mb-4 grid grid-cols-2 gap-2"><select class="input" onchange="cashF.m=this.value;renderCash()"><option value="">كل الطرق</option>${Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${cashF.m===k?'selected':''}>${v}</option>`).join('')}</select><select class="input" onchange="cashF.k=this.value;renderCash()"><option value="">كل الأنواع</option>${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${cashF.k===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div class="card !p-0 overflow-hidden" id="cashTable"></div>`;
Pages.cashbox_after=()=>renderCash();
function renderCash(){
  const list=DB.data.movements.filter(m=>(!cashF.m||m.method===cashF.m)&&(!cashF.k||m.kind===cashF.k)).slice().reverse().slice(0,300);
  $('#cashTable').innerHTML=tbl(['التاريخ','النوع','الطريقة','البيان','وارد','صادر'],list.map(m=>`<tr><td>${fdate(m.date)}</td><td><span class="badge bg-slate-100 dark:bg-slate-700">${KINDS[m.kind]||m.kind}</span></td><td>${METHODS[m.method]}</td><td>${esc(m.note)}</td><td class="text-emerald-600 font-bold">${m.type==='in'?money(m.amount):''}</td><td class="text-rose-600 font-bold">${m.type==='out'?money(m.amount):''}</td></tr>`),'لا توجد حركات');
  lucide.createIcons();
}
function cashModal(op){
  const t={in:'إيداع في الصندوق',out:'سحب من الصندوق',transfer:'تحويل بين طرق الدفع'}[op];
  openModal(t,`<div class="grid grid-cols-2 gap-3">${fld('المبلغ',`<input name="amount" type="number" step="0.01" min="0.01" class="input" required>`)}${fld(op==='transfer'?'من':'الطريقة',methodSelect())}${op==='transfer'?fld('إلى',methodSelect('to','card')):''}</div>${fld('البيان',`<input name="note" class="input">`)}`,
  {onSubmit:f=>{Ops.cashOp({op,...f});toast('تم تنفيذ العملية');refresh()}});
}

/* ===================== CUSTOMERS ===================== */
let custQ='';
Pages.customers=()=>pageHead('customers',`<button class="btn btn-primary" onclick="customerModal()"><i data-lucide="user-plus" class="w-4 h-4"></i> عميل جديد</button>`)+`
  <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">${stat('عدد العملاء',DB.data.customers.length,'users','sky')}${stat('إجمالي الديون',money(totalDebts()),'hand-coins','rose')}<div class="col-span-2 md:col-span-1">${stat('عملاء مدينون',DB.data.customers.filter(c=>c.balance>0).length,'user-x','amber')}</div></div>
  <div class="card mb-4"><input class="input" placeholder="بحث بالاسم أو الهاتف" value="${esc(custQ)}" oninput="custQ=this.value;renderCust()"></div><div class="card !p-0 overflow-hidden" id="custTable"></div>`;
Pages.customers_after=()=>renderCust();
function renderCust(){
  const q=custQ.trim();const list=DB.data.customers.filter(c=>!q||c.name.includes(q)||(c.phone||'').includes(q));
  $('#custTable').innerHTML=tbl(['العميل','الهاتف','العنوان','عدد الفواتير','إجمالي المشتريات','الدين','إجراءات'],list.map(c=>{const inv=DB.data.invoices.filter(i=>i.customerId===c.id);return`<tr><td class="font-semibold"><div class="flex items-center gap-2"><span class="w-8 h-8 rounded-full bg-gradient-to-br from-sky-400 to-blue-600 text-white grid place-items-center text-xs font-bold">${esc(c.name[0])}</span>${esc(c.name)}</div></td><td dir="ltr" class="text-right">${esc(c.phone)}</td><td>${esc(c.address)}</td><td>${inv.length}</td><td>${money(sum(inv,i=>i.total))}</td><td class="font-extrabold ${c.balance>0?'text-rose-600':'text-emerald-600'}">${money(c.balance)}</td><td class="flex gap-1">${c.balance>0?iconBtn('hand-coins',`collectModal('${c.id}')`,'تحصيل','text-emerald-600'):''}${iconBtn('file-text',`statement('${c.id}')`,'كشف حساب')}${iconBtn('pencil',`customerModal('${c.id}')`,'تعديل')}${iconBtn('trash-2',`confirmBox('حذف العميل؟',()=>{Ops.deleteCustomer('${c.id}');toast('تم الحذف');refresh()})`,'حذف','text-rose-500')}</td></tr>`}),'لا يوجد عملاء');
  lucide.createIcons();
}
function customerModal(id){
  const c=id?getC(id):{name:'',phone:'',address:''};
  openModal(id?'تعديل عميل':'إضافة عميل',`${fld('الاسم *',`<input name="name" class="input" required value="${esc(c.name)}">`)}<div class="grid grid-cols-2 gap-3">${fld('الهاتف',`<input name="phone" class="input" dir="ltr" value="${esc(c.phone)}">`)}${fld('العنوان',`<input name="address" class="input" value="${esc(c.address)}">`)}</div>${id?'':fld('دين سابق (رصيد افتتاحي)',`<input name="opening" type="number" step="0.01" min="0" class="input" value="0">`)}`,
  {onSubmit:f=>{Ops.saveCustomer({...f,id});toast('تم الحفظ');refresh()}});
}

/* ===================== REPORTS ===================== */
const REPORTS={
  sales:{t:'تقرير المبيعات',i:'shopping-cart',range:true,fn:(f,t)=>{const s=stats(f,t);const inv=DB.data.invoices.filter(i=>inRange(i.date,f,t));
    return kv([['عدد الفواتير',s.count],['إجمالي المبيعات',money(s.sales)],['المرتجعات',money(s.returns)],['صافي المبيعات',money(s.netSales),'b'],['نقدي',money(s.byMethod.cash)],['بطاقة',money(s.byMethod.card)],['تحويل',money(s.byMethod.transfer)],['آجل',money(s.byMethod.debt)],['مجمل الربح',money(s.gross),'b pos']])+
    `<h3>الفواتير</h3>`+rtable(['رقم','التاريخ','العميل','الإجمالي','المدفوع','الدفع'],inv.map(i=>`<tr><td>#${i.no}</td><td>${fdate(i.date)}</td><td>${esc(i.customerName)}</td><td>${money(i.total)}</td><td>${money(i.paid)}</td><td>${PAY[i.method]}</td></tr>`))}},
  items:{t:'الأصناف الأكثر مبيعًا',i:'award',range:true,fn:(f,t)=>{const agg={};DB.data.invoices.filter(i=>inRange(i.date,f,t)).forEach(i=>i.items.forEach(x=>{const a=agg[x.pid]||(agg[x.pid]={name:x.name,unit:x.unit,qty:0,total:0,profit:0});a.qty+=x.qty;a.total+=x.qty*x.price;a.profit+=x.qty*(x.price-x.cost)}));
    return`<h3>الأصناف المباعة</h3>`+rtable(['#','الصنف','الكمية','المبيعات','الربح'],Object.values(agg).sort((a,b)=>b.total-a.total).map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.name)}</td><td>${qtyFmt(r3(a.qty),a.unit)}</td><td>${money(a.total)}</td><td>${money(a.profit)}</td></tr>`))}},
  inventory:{t:'تقرير جرد المخزون',i:'warehouse',range:false,fn:()=>kv([['عدد المنتجات',DB.data.products.length],['قيمة المخزون بالتكلفة',money(invValue()),'b'],['القيمة البيعية',money(sum(DB.data.products,p=>Math.max(p.stock,0)*p.price))]])+
    rtable(['المنتج','التصنيف','الوحدة','المخزون','التكلفة','سعر البيع','القيمة'],DB.data.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${p.unit==='kg'?'كغ':'قطعة'}</td><td>${qtyFmt(p.stock,p.unit)}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(Math.max(p.stock,0)*p.cost)}</td></tr>`))},
  low:{t:'المنتجات منخفضة المخزون',i:'alert-triangle',range:false,fn:()=>rtable(['المنتج','المخزون','الحد الأدنى','المطلوب تقريبًا'],lowStock().map(p=>`<tr><td>${esc(p.name)}</td><td>${qtyFmt(p.stock,p.unit)}</td><td>${qtyFmt(p.minStock,p.unit)}</td><td>${qtyFmt(Math.max(0,p.minStock*2-p.stock),p.unit)}</td></tr>`))},
  debts:{t:'تقرير ديون العملاء',i:'hand-coins',range:false,fn:()=>kv([['إجمالي الديون',money(totalDebts()),'b neg']])+rtable(['العميل','الهاتف','الدين'],DB.data.customers.filter(c=>c.balance>0).sort((a,b)=>b.balance-a.balance).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${money(c.balance)}</td></tr>`))},
  expenses:{t:'تقرير المصاريف',i:'wallet',range:true,fn:(f,t)=>{const l=DB.data.expenses.filter(e=>inRange(e.date,f,t));return kv([['إجمالي المصاريف',money(sum(l,e=>e.amount)),'b']])+rtable(['التاريخ','الفئة','المبلغ','الطريقة','البيان'],l.map(e=>`<tr><td>${fdate(e.date)}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td><td>${METHODS[e.method]}</td><td>${esc(e.note)}</td></tr>`))}},
  purchases:{t:'تقرير المشتريات',i:'truck',range:true,fn:(f,t)=>{const l=DB.data.purchases.filter(p=>inRange(p.date,f,t));return kv([['إجمالي المشتريات',money(sum(l,p=>p.total)),'b'],['المدفوع',money(sum(l,p=>p.paid))],['مستحقات الموردين الحالية',money(totalPayables())]])+rtable(['رقم','التاريخ','المورد','الإجمالي','المدفوع'],l.map(p=>`<tr><td>#${p.no}</td><td>${fdate(p.date)}</td><td>${esc(p.supplierName)}</td><td>${money(p.total)}</td><td>${money(p.paid)}</td></tr>`))}},
  pnl:{t:'الأرباح والخسائر',i:'trending-up',range:true,fn:pnlBody},
  cash:{t:'حركة الصندوق',i:'piggy-bank',range:true,fn:(f,t)=>{const l=DB.data.movements.filter(m=>inRange(m.date,f,t));return kv([['الوارد',money(sum(l.filter(m=>m.type==='in'),m=>m.amount))],['الصادر',money(sum(l.filter(m=>m.type==='out'),m=>m.amount))],['النقدية الحالية',money(balance('cash')),'b'],['إجمالي الأرصدة',money(balance()),'b']])+rtable(['التاريخ','النوع','الطريقة','البيان','وارد','صادر'],l.map(m=>`<tr><td>${fdate(m.date)}</td><td>${KINDS[m.kind]||''}</td><td>${METHODS[m.method]}</td><td>${esc(m.note)}</td><td>${m.type==='in'?money(m.amount):''}</td><td>${m.type==='out'?money(m.amount):''}</td></tr>`))}},
  capital:{t:'تقرير رأس المال',i:'landmark',range:false,fn:()=>{const c=capSummary();return kv([['إجمالي الإيداعات',money(c.dep)],['إجمالي السحوبات',money(c.wd)],['رأس المال المستثمر',money(c.capital),'b'],['قيمة المخزون',money(c.inv)],['الأرصدة النقدية',money(c.cash)],['ديون العملاء',money(c.rec)],['مستحقات الموردين',money(c.pay)],['صافي قيمة المشروع',money(c.equity),'b'],['الربح التراكمي',money(c.profit),'b '+(c.profit>=0?'pos':'neg')]])}}
};
let repState={type:'sales',from:monthStart(),to:today()};
function currentReport(){const r=REPORTS[repState.type];const range=r.range?(repState.from||'البداية')+' ← '+(repState.to||'اليوم'):'';return reportDoc(r.t,r.fn(repState.from,repState.to),range)}
Pages.reports=()=>{
  const r=REPORTS[repState.type];
  return pageHead('reports',`<button class="btn btn-primary" onclick="printHTML(currentReport())"><i data-lucide="printer" class="w-4 h-4"></i> طباعة التقرير</button>`)+`
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2 mb-4">${Object.entries(REPORTS).map(([k,v])=>`<button onclick="repState.type='${k}';refresh()" class="card !p-3 flex items-center gap-2 text-sm font-bold transition ${repState.type===k?'!border-fuchsia-500 ring-2 ring-fuchsia-500/30 text-fuchsia-700 dark:text-fuchsia-300':'hover:shadow-md'}"><i data-lucide="${v.i}" class="w-4 h-4 shrink-0"></i>${v.t}</button>`).join('')}</div>
  ${r.range?`<div class="card mb-4 flex flex-wrap gap-2 items-end">${fld('من',`<input type="date" class="input" value="${repState.from}" onchange="repState.from=this.value;refresh()">`)}${fld('إلى',`<input type="date" class="input" value="${repState.to}" onchange="repState.to=this.value;refresh()">`)}<button class="btn btn-ghost btn-sm" onclick="repState.from=today();repState.to=today();refresh()">اليوم</button><button class="btn btn-ghost btn-sm" onclick="repState.from=monthStart();repState.to=today();refresh()">هذا الشهر</button><button class="btn btn-ghost btn-sm" onclick="repState.from='';repState.to='';refresh()">الكل</button></div>`:''}
  <div class="bg-white text-black rounded-2xl p-4 md:p-6 shadow-sm overflow-x-auto">${currentReport()}</div>`;
};

async function changePw(e){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  if(await hashPw(f.old)!==DB.data.settings.passHash)return toast('كلمة المرور الحالية غير صحيحة','error');
  if(f.nw.length<4)return toast('كلمة المرور قصيرة جدًا','error');if(f.nw!==f.nw2)return toast('التأكيد غير مطابق','error');
  DB.data.settings.passHash=await hashPw(f.nw);DB.data.settings.defaultPass=false;DB.save();e.target.reset();toast('تم تغيير كلمة المرور');
}
function exportDB(){const b=new Blob([JSON.stringify(DB.data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='supermarket-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('تم التصدير')}
function importDB(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.meta||!Array.isArray(d.products))throw new Error('ملف غير صالح');const keep={passHash:DB.data.settings.passHash,defaultPass:DB.data.settings.defaultPass};const salt=DB.data.meta.salt;d.meta.salt=salt;d.settings={...d.settings,...keep};DB.data=d;DB.load.call({...DB,data:null});DB.save();toast('تم الاستيراد بنجاح');render()}catch(e){toast(e.message,'error')}};r.readAsText(file)}
function resetDB(demo){
  const keep={passHash:DB.data.settings.passHash,defaultPass:DB.data.settings.defaultPass,theme:DB.data.settings.theme,apiUrl:DB.data.settings.apiUrl,apiToken:DB.data.settings.apiToken};const salt=DB.data.meta.salt;
  DB.data=DB.defaults();DB.data.meta.salt=salt;Object.assign(DB.data.settings,keep);DB.save();if(demo)seed();cart=[];DB.save();toast(demo?'تم إنشاء بيانات تجريبية':'تم تصفير البيانات');render();
}
function runTests(){
  const backup=JSON.stringify(DB.data);DB.silent=true;const res=[];
  const T=(n,fn)=>{try{fn();res.push([n,true,''])}catch(e){res.push([n,false,e.message])}};
  const A=(c,m)=>{if(!c)throw new Error(m||'فشل التحقق')};
  const throws=fn=>{try{fn();return false}catch(e){return true}};
  let p,w,inv,cust,sup;
  T('إضافة منتج جديد',()=>{p=Ops.saveProduct({name:'منتج اختبار',barcode:'TST'+Date.now(),category:'اختبار',unit:'piece',price:10,cost:6,stock:0,minStock:2});A(getP(p.id),'المنتج غير محفوظ')});
  T('تعديل منتج (السعر)',()=>{Ops.saveProduct({...getP(p.id),price:12});A(getP(p.id).price===12,'السعر لم يتغير')});
  T('رفض باركود مكرر',()=>A(throws(()=>Ops.saveProduct({name:'x',barcode:getP(p.id).barcode,unit:'piece',price:1,cost:1})),'قُبل باركود مكرر'));
  T('إيداع رأس مال',()=>{const b=balance('cash');Ops.capital({type:'deposit',amount:1000,method:'cash',note:'اختبار'});A(balance('cash')===r2(b+1000),'رصيد الصندوق خاطئ')});
  T('مشتريات من مورد (إضافة مخزون + دين مورد)',()=>{sup=Ops.saveSupplier({name:'مورد اختبار'});const b=balance('cash');Ops.purchase({supplierId:sup.id,items:[{pid:p.id,qty:20,cost:6}],paid:100,method:'cash'});A(getP(p.id).stock===20,'المخزون');A(balance('cash')===r2(b-100),'الصندوق');A(getS(sup.id).balance===20,'رصيد المورد')});
  T('سداد مورد',()=>{Ops.paySupplier(sup.id,20,'cash');A(getS(sup.id).balance===0)});
  T('بيع عادي (نقدي)',()=>{const b=balance('cash');inv=Ops.sell({items:[{pid:p.id,qty:3}],method:'cash'});A(inv.total===36,'الإجمالي');A(getP(p.id).stock===17,'المخزون');A(balance('cash')===r2(b+36),'الصندوق')});
  T('بيع بالوزن (0.75 كغ)',()=>{w=Ops.saveProduct({name:'منتج وزن اختبار',unit:'kg',price:8,cost:5,stock:10,minStock:1});const i=Ops.sell({items:[{pid:w.id,qty:0.75}],method:'card'});A(i.total===6,'السعر');A(Math.abs(getP(w.id).stock-9.25)<1e-9,'المخزون')});
  T('بيع مع خصم',()=>{const i=Ops.sell({items:[{pid:p.id,qty:1}],discount:2,method:'cash'});A(i.total===10)});
  T('بيع آجل (دين)',()=>{cust=Ops.saveCustomer({name:'عميل اختبار'});Ops.sell({items:[{pid:p.id,qty:2}],method:'debt',paid:4,customerId:cust.id});A(getC(cust.id).balance===20,'الدين')});
  T('تحصيل دين',()=>{const b=balance('cash');Ops.collectDebt(cust.id,15,'cash');A(getC(cust.id).balance===5);A(balance('cash')===r2(b+15))});
  T('منع تحصيل أكثر من الدين',()=>A(throws(()=>Ops.collectDebt(cust.id,999))));
  T('إرجاع منتج',()=>{const b=balance('cash'),st=getP(p.id).stock;const r=Ops.returnItems(inv.id,{0:1});A(r.amount===12,'المبلغ');A(getP(p.id).stock===st+1,'المخزون');A(balance('cash')===r2(b-12),'الصندوق')});
  T('منع إرجاع أكثر من المباع',()=>A(throws(()=>Ops.returnItems(inv.id,{0:5}))));
  T('منع البيع بأكثر من المخزون',()=>A(throws(()=>Ops.sell({items:[{pid:p.id,qty:9999}]}))));
  T('تسجيل مصروف',()=>{const b=balance('cash');Ops.addExpense({category:'أخرى',amount:5,method:'cash'});A(balance('cash')===r2(b-5))});
  T('سحب من رأس المال',()=>{const b=balance('cash');Ops.capital({type:'withdraw',amount:50,method:'cash'});A(balance('cash')===r2(b-50))});
  T('حساب الأرباح والخسائر',()=>{const s=stats(today(),today());A(s.count>=4);A(Math.abs(s.gross-(s.netSales-s.cogs))<0.01)});
  T('توليد وطباعة التقارير',()=>{Object.values(REPORTS).forEach(r=>{const h=reportDoc(r.t,r.fn(today(),today()));A(h.length>100,'تقرير فارغ: '+r.t)})});
  T('سلامة المعاملات (Rollback)',()=>{const n=DB.data.invoices.length,st=getP(p.id).stock;throws(()=>Ops.sell({items:[{pid:p.id,qty:1},{pid:'bad',qty:1}]}));A(DB.data.invoices.length===n&&getP(p.id).stock===st,'لم يتم التراجع')});
  DB.data=JSON.parse(backup);DB.silent=false;DB.saveLocal();
  const ok=res.filter(r=>r[1]).length;
  $('#testResults').innerHTML=`<div class="mb-3 p-3 rounded-xl font-bold ${ok===res.length?'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300':'bg-rose-50 text-rose-700'}">نجح ${ok} من ${res.length} اختبار ${ok===res.length?'✅':'⚠️'} — تمت استعادة بياناتك الأصلية</div>
  <div class="grid sm:grid-cols-2 gap-2">${res.map(([n,o,m])=>`<div class="flex items-center gap-2 p-2 rounded-xl text-sm ${o?'bg-slate-50 dark:bg-slate-900/50':'bg-rose-50 dark:bg-rose-500/10'}"><i data-lucide="${o?'check-circle-2':'x-circle'}" class="w-5 h-5 ${o?'text-emerald-500':'text-rose-500'} shrink-0"></i><span class="flex-1">${n}</span>${m?`<span class="text-xs text-rose-600">${esc(m)}</span>`:''}</div>`).join('')}</div>`;
  lucide.createIcons();toast(`اكتملت الاختبارات: ${ok}/${res.length}`,ok===res.length?'success':'error');
}

/* ===================== Boot ===================== */
function enterApp(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#sideStore').textContent=DB.data.settings.storeName;updateSync();render();resetIdle();
  if(DB.data.settings.apiUrl)Server.pull().then(()=>{applyTheme();render(true)});
}
async function boot(){
  DB.load();applyTheme();
  $('#yr').textContent=new Date().getFullYear();
  if(!DB.data.settings.passHash){DB.data.settings.passHash=await hashPw('1234');DB.data.settings.defaultPass=true;DB.saveLocal()}
  const tick=()=>{$('#clock').textContent=new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})};tick();setInterval(tick,30000);
  lucide.createIcons();
  if(ss('sm_auth')===DB.data.meta.salt)enterApp();else showLogin();
}
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
addEventListener('resize',()=>{if(innerWidth>=1024){$('#sidebar').classList.remove('translate-x-full');$('#overlay').classList.add('hidden')}else $('#sidebar').classList.add('translate-x-full')});
boot();
</script>
